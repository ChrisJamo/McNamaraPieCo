<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>McNamara Pie Co.</title>

		<!-- Bootstrap CSS -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>

		<!-- Google Font: Lora -->
		<link
			href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap"
			rel="stylesheet"
		/>

		<!-- Custom Styles -->
		<link rel="stylesheet" href="/css/styles.css" />
	</head>
	<body>
		<!-- MARK: Hero Section -->
		<section class="hero" id="hero">
			<div class="container text-center">
				<!-- Header Text with Cherries and Underline -->
				<div class="hero-header">
					<h1 class="hero-title">
						<img
							src="./Images/mainImages/cherry.png"
							alt="Cherry"
							class="cherry-icon"
						/>
						<span class="line1"
							>Homemade Pies, <span class="baked">Baked</span></span
						><br />
						<span class="line2"
							>With <span class="love">Love</span>, Perfect For</span
						><br />
						<span class="line3"
							>Your <span class="family">Family</span> Table!</span
						>
						<img
							src="./Images/mainImages/Ellipse.png"
							alt="Underline"
							class="underline-icon"
						/>
					</h1>
				</div>
			</div>

			<div class="hero-buttons">
				<a href="#" class="btn shop-now">Shop Now</a>
				<a href="#" class="btn discover-pies">Discover Pies</a>
			</div>

			<!-- Quote -->
			<p class="hero-quote">
				"Pie makes everybody happy!" - Laurie Halse Anderson
			</p>

			<!-- Left Side Image -->
			<div class="left-side-image">
				<img
					src="./Images/mainImages/RightSidePic.png"
					alt="Pie with Crumbs"
					class="left-pie"
				/>
			</div>

			<!-- Right Side -->
			<div class="right-side">
				<!-- Right Side Image -->
				<div class="right-side-image">
					<img
						src="./Images/mainImages/LeftSidePic.png"
						alt="Apple Pie with Strawberries"
						class="right-pie"
					/>

					<!-- Contact Information (Now Correctly Positioned) -->
					<div class="contact-info">
						<p class="email">mcnamarapieco@gmail.com</p>
						<p class="phone">
							<img
								src="./Images/mainImages/Phone.png"
								alt="Phone Icon"
								class="phone-icon"
							/>
							519-919-2285
						</p>
					</div>
				</div>
			</div>
		</section>

		<!--  Correct Bootstrap JS (Placed at the end of <body>) -->
		<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.4.4/dist/umd/popper.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.min.js"></script>
	</body>
</html>
