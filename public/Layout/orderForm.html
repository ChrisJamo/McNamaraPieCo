<section id="order">
    <h2 class="section-title">Place an Order</h2>
    <p class="order-title">Order your favorite pies online!</p>

    <div class="order-container">
        <div class="order-form">
            <div class="payment-method">
                <div class="payment-header">Payment Method</div>
                <div class="payment-options">
                    <label>
                        <img src="./Images/orderFormImages/img_2.png" alt="Cash payment option" />
                        <span>Cash</span>
                        <input type="radio" name="payment" value="cash" required />
                    </label>
                    <label>
                        <img src="./Images/orderFormImages/img_1.png" alt="E-transfer payment option" />
                        <span>Interac e-Transfer® to <a href="mailto:mcnamarapieco@gmail.com">mcnamarapieco@gmail.com</a></span>
                        <input type="radio" name="payment" value="etransfer" required />
                    </label>

                </div>


            </div>

            <form action="#" method="POST">
                <div class="name-fields">
                    <input type="text" placeholder="First name" required aria-label="First name" />
                    <input type="text" placeholder="Last name" required aria-label="Last name" />
                </div>
                <input type="email" placeholder="Email" required aria-label="Email address" />
                <input type="tel" placeholder="+1 (555) 000-0000" required aria-label="Phone number" />

                <div class="date-time">
                    <input type="date" required aria-label="Pickup date" />
                    <select required aria-label="Pickup time period">
                        <option value="">Select a time</option>
                        <option value="08:00 AM">08:00 AM</option>
                        <option value="08:30 AM">08:30 AM</option>
                        <option value="09:00 AM">09:00 AM</option>
                        <option value="09:30 AM">09:30 AM</option>
                        <option value="10:00 AM">10:00 AM</option>
                        <option value="10:30 AM">10:30 AM</option>
                        <option value="11:00 AM">11:00 AM</option>
                        <option value="11:30 AM">11:30 AM</option>
                        <option value="12:00 PM">12:00 PM</option>
                        <option value="12:30 PM">12:30 PM</option>
                        <option value="01:00 PM">01:00 PM</option>
                        <option value="01:30 PM">01:30 PM</option>
                        <option value="02:00 PM">02:00 PM</option>
                        <option value="02:30 PM">02:30 PM</option>
                        <option value="03:00 PM">03:00 PM</option>
                        <option value="03:30 PM">03:30 PM</option>
                        <option value="04:00 PM">04:00 PM</option>
                        <option value="04:30 PM">04:30 PM</option>
                        <option value="05:00 PM">05:00 PM</option>
                        <option value="05:30 PM">05:30 PM</option>
                        <option value="06:00 PM">06:00 PM</option>
                        <option value="06:30 PM">06:30 PM</option>
                        <option value="07:00 PM">07:00 PM</option>
                        <option value="07:30 PM">07:30 PM</option>
                        <option value="08:00 PM">08:00 PM</option>
                    </select>
                </div>

                <div id="pie-selection-container">
                    <div class="select-fields">
                        <select required aria-label="Pie selection" id="pie-selection">
                            <option value="">Pick your pie</option>
                            <option value="Coconut Cream Pie">Coconut Cream Pie</option>
                            <option value="Chocolate Cream Pie">Chocolate Cream Pie</option>
                            <option value="Pecan Pie">Pecan Pie</option>
                            <option value="Key Lime Pie">Key Lime Pie</option>
                            <option value="Banana Cream Pie">Banana Cream Pie</option>
                            <option value="Lemon Meringue Pie">Lemon Meringue Pie</option>
                            <option value="Salted Caramel Apple">Salted Caramel Apple</option>
                            <option value="Mixed Berries">Mixed Berries</option>
                            <option value="Cherry Pie">Cherry Pie</option>
                            <option value="Strawberry Pie">Strawberry Pie</option>
                            <option value="Blueberry Pie">Blueberry Pie</option>
                            <option value="Pumpkin Pie">Pumpkin Pie</option>
                        </select>
                        <input type="number" min="1" value="1" required aria-label="Quantity" />
                    </div>
                </div>

                <button type="button" id="add-pie">Add Another Pie</button>

                <textarea placeholder="If you are requesting a custom order, please let us know..." aria-label="Custom order notes"></textarea>

                <button type="submit">Submit Order</button>
                <p class="note">A copy of your responses will be emailed to the address you provided.</p>
            </form>

            <p class="contact-info">
                Tel: <a href="tel:+15199192285">519-919-2285</a>   
                Email: <a href="mailto:mcnamarapieco@gmail.com">mcnamarapieco@gmail.com</a>
            </p>
        </div>

        <div class="image-section">
            <div class="image-placeholder">
                <img src="./Images/orderImage.png" alt="Freshly baked pie" width="1200px" height="auto" />
            </div>
        </div>
    </div>
</section>
