name: Deploy to GitHub Pages

on:
  push:
    branches:
      - frontEndMain  # Change this if your branch is different

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .  # Adjust this if your files are inside a subfolder

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
