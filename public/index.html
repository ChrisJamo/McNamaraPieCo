<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>McNamaraPieCo</title>

	<!-- Stylesheets -->
	<link rel="stylesheet" href="../css/styles.css">
	<link rel="stylesheet" href="../css/hero.css">
	<link rel="stylesheet" href="../css/product.css">
	<link rel="stylesheet" href="../css/aboutMe.css">
	<link rel="stylesheet" href="../css/features.css">
	<link rel="stylesheet" href="../css/testimonials.css">
	<link rel="stylesheet" href="../css/orderForm.css">

	<!-- Google Font: Lora -->
	<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap" rel="stylesheet">

	<!-- FontAwesome for Social Icons -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
<!-- Header -->
<header>
	<div class="logo">
		<img src="Images/logo.png" alt="McNamaraPieCo's logo">
	</div>

	<!-- Accessible Hidden Heading -->
	<h1 id="responsive-heading" style="display: none;">McNamaraPieCo</h1>

	<!-- Navigation -->
	<nav>
		<ul>
			<li><a href="#home">Home</a></li>
			<li><a href="#products">Products</a></li>
			<li><a href="#about">About Me</a></li>
			<li><a href="#features">Feature Treats</a></li>
			<li><a href="#testimonials">Testimonials</a></li>
			<li><a href="#order">Place Order</a></li>
		</ul>

		<!-- Social Media Icons -->
		<div class="social-icons">
			<a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
			<a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
		</div>
	</nav>

	<!-- Mobile Menu (Hamburger) -->
	<div id="hamburger-icon" onclick="toggleMobileMenu(this)">
		<div class="bar1"></div>
		<div class="bar2"></div>
		<div class="bar3"></div>
		<ul class="mobile-menu">
			<li><a href="#home">Home</a></li>
			<li><a href="#products">Products</a></li>
			<li><a href="#about">About Me</a></li>
			<li><a href="#features">Feature Treats</a></li>
			<li><a href="#testimonials">Testimonials</a></li>
			<li><a href="#order">Place Order</a></li>
			<li class="social-icons">
				<a href="#"><i class="fab fa-facebook-f"></i></a>
				<a href="#"><i class="fab fa-instagram"></i></a>
			</li>
		</ul>
	</div>
</header>

<!-- Main Content -->
<main>
	<!-- Hero Section (Dynamically Loaded) -->
	<section class="hero" id="home"></section>

	<!-- Products Section -->
	<section id="products" class="product-container"></section>

	<!-- About Me Section -->
	<section id="about" class="container"></section>

	<!-- Features Section (Uncomment when content is ready) -->
	<!-- <section id="features">
        <h2>Feature Treats</h2>
        <p>Discover our limited-time specialty treats.</p>
    </section> -->

	<!-- Testimonials Section -->
	<section id="testimonials" class="testimonials"></section>

	<!-- Order Form Section -->
	<section id="order" class="order"></section>

</main>

<!-- Scripts (Load JavaScript at the end for better performance) -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.4.4/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.min.js"></script>
<script src="../js/Dynamic-Loader.js"></script>
<script src="../js/Index.js"></script>
</body>
</html>
